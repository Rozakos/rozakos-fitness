name: Verify

# The gate that catches a broken main. This repo takes pushes from more than one
# machine, so "it passed locally" is not a claim anyone can make about someone
# else's commit — this runs the same three checks on every one of them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the dev box (3.12.10).
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: pytest
        working-directory: backend
        run: python -m pytest tests -q
        # Also covers test_catalog_sync.py, which asserts backend/app/seed.py and
        # mobile/src/local/catalog.ts still describe the same ~250 exercises.

  mobile:
    name: Mobile typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the dev box (v24).
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        # `mobile/` ships without eslint in node_modules after a fresh clone.
        run: npm ci

      - name: tsc --noEmit
        working-directory: mobile
        run: npx tsc --noEmit

      - name: expo lint
        working-directory: mobile
        run: npx expo lint
        env:
          EXPO_NO_TELEMETRY: '1'

  # Guards the mirror in mobile/src/local/api.ts, which reimplements the REST
  # surface on-phone for local-only mode. It has no test runner of its own, so
  # the checks compile it to CommonJS and drive it from node with react-native
  # stubbed — the trick AGENTS.md describes, run automatically instead of by hand.
  local-mode:
    name: Local-mode API parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run the local-mode checks
        run: node scripts/check-local-mode.mjs
